# Relay with per-member tokens. Put members.json next to this file, replace 10.8.0.1 with the
# host's private or VPN address, then run:
#   chmod 600 members.json && HOPTELL_UID=$(id -u) HOPTELL_BIND=10.8.0.1 docker compose up -d
# The relay runs as the file's owner, so it can read the private file.
services:
  hoptell:
    image: ghcr.io/eminuzun/hoptell:latest # in production, pin the version your clients run, e.g. :0.3.0
    restart: unless-stopped
    user: "${HOPTELL_UID:-1000}"
    ports:
      # Publish on one private or VPN address; "7777:7777" publishes on all host addresses by default.
      - "${HOPTELL_BIND:-127.0.0.1}:7777:7777" # e.g. HOPTELL_BIND=10.8.0.1
    environment:
      HOPTELL_MEMBERS: /run/secrets/members.json
      # Optional keyed log fingerprints (see the README); also uncomment the secret below.
      # HOPTELL_LOG_FINGERPRINTS: "on"
      # HOPTELL_LOG_FINGERPRINT_KEY_FILE: /run/secrets/fingerprint-key.json
    volumes:
      # The realm id lives here; keep this volume across updates. A named volume starts owned by
      # the image's user (uid 1000); with another HOPTELL_UID, bind-mount a directory you chown.
      - hoptell-state:/data
    secrets:
      - members.json
      # - fingerprint-key.json
volumes:
  hoptell-state:
secrets:
  members.json:
    file: ./members.json
  # fingerprint-key.json:            # mode 0600, owned by HOPTELL_UID; after replacing it,
  #   file: ./fingerprint-key.json   # run: docker compose up -d --force-recreate hoptell
