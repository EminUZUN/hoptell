test:
  image: node:${NODE}
  variables:
    GIT_DEPTH: 0 # full history: a compatibility test runs an earlier relay from it
  parallel:
    matrix:
      - NODE: ["22", "24"]
  before_script:
    - apk add --no-cache tmux || (apt-get update && apt-get install -y tmux) || true
    - npm ci
  script:
    - npm run lint
    - npm test
